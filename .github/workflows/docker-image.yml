name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_SECRET }}

    - name: Build and Push
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/next-js-starter-repository:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/next-js-starter-repository:latest
        
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Apps
      uses: azure/CLI@v2
      with:
        inlineScript: |
          az containerapp registry set \
            --name next-js-starter-app \
            --resource-group next-js-starter-app-group \
            --server index.docker.io \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password "${{ secrets.DOCKER_SECRET }}"

            az containerapp update \
              --name next-js-starter-app \
              --resource-group next-js-starter-app-group \
              --image index.docker.io/${{ secrets.DOCKER_USERNAME }}/next-js-starter-repository:latest
